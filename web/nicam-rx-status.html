<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NICAM RX Status</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: 650;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .tile {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      background: #1b1b1b;
    }
    .label {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .value {
      font-variant-numeric: tabular-nums;
      font-size: 25px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .ok {
      color: #63d471;
    }
    .bad {
      color: #ff6961;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #171717;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #2c2c2c;
      font-variant-numeric: tabular-nums;
    }
    td:first-child {
      color: #aaa;
      width: 240px;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .footer {
      margin-top: 12px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>NICAM RX Status</h1>
    <section class="summary">
      <div class="tile">
        <div class="label">Lock</div>
        <div id="locked" class="value">-</div>
      </div>
      <div class="tile">
        <div class="label">Station ID</div>
        <div id="station_id" class="value">-</div>
      </div>
      <div class="tile">
        <div class="label">Slicer confidence</div>
        <div id="slicer_conf" class="value">-</div>
      </div>
      <div class="tile">
        <div class="label">Bad frame rate</div>
        <div id="bad_frame_rate" class="value">-</div>
      </div>
    </section>
    <table>
      <tbody id="details"></tbody>
    </table>
    <div class="footer" id="footer">Waiting for nicam-rx-status.json</div>
  </main>
  <script>
    const statusUrl = new URLSearchParams(location.search).get("status") || "nicam-rx-status.json";
    const detailKeys = [
      "frames",
      "bad_frames",
      "pending_frames",
      "align_drop_bits",
      "sync_drop_bits",
      "bitbuffer_bits",
      "hypothesis",
      "faw_hits",
      "faw_error_sum",
      "resets",
      "slicer_symbols",
      "carrier_hz",
      "omega",
      "station_cycles",
      "timestamp_ms"
    ];

    function formatValue(key, value) {
      if (value === null || value === undefined) return "-";
      if (key === "bad_frame_rate") return `${(value * 100).toFixed(3)}%`;
      if (key === "slicer_conf") return Number(value).toFixed(3);
      if (key === "carrier_hz") return `${Number(value).toFixed(1)} Hz`;
      if (key === "omega") return Number(value).toFixed(6);
      if (key === "timestamp_ms") return new Date(Number(value)).toLocaleString();
      return String(value);
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    async function update() {
      try {
        const response = await fetch(`${statusUrl}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        const locked = document.getElementById("locked");
        locked.textContent = data.locked ? "LOCKED" : "NO LOCK";
        locked.className = `value ${data.locked ? "ok" : "bad"}`;
        setText("station_id", (data.station_id || "").trim() || "-");
        setText("slicer_conf", formatValue("slicer_conf", data.slicer_conf));
        setText("bad_frame_rate", formatValue("bad_frame_rate", data.bad_frame_rate));

        document.getElementById("details").innerHTML = detailKeys.map((key) => (
          `<tr><td>${key}</td><td>${formatValue(key, data[key])}</td></tr>`
        )).join("");
        setText("footer", `Updated from ${statusUrl}`);
      } catch (error) {
        document.getElementById("locked").textContent = "OFFLINE";
        document.getElementById("locked").className = "value bad";
        setText("footer", `Cannot read ${statusUrl}: ${error.message}`);
      }
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
