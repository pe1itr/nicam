[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nicam-direct-qpsk"
version = "0.1.0"
description = "Direct NICAM DQPSK experiments for PlutoSDR and RTL-SDR"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy>=1.24",
  "pyadi-iio>=0.0.16",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
audio-device = [
  "sounddevice>=0.4",
]

[project.scripts]
wbfm-rx = "wbfm_rx.rtl_rx:main"
wbfm-tx = "wbfm_tx.main:main"

[tool.setuptools.packages.find]
where = ["src"]
